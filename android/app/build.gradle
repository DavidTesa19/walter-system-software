apply plugin: 'com.android.application'

// Walter System for Android: one screen showing https://app.waltersystem.cz in
// Android's built-in web engine (System WebView), so no browser is needed and
// there is never an address bar. The website itself is the app; this only
// adds what a browser would otherwise provide (microphone, files, links).
//
// Raise versionCode for every build handed out, or phones refuse to install it
// over the previous one. Version 1 was the Chrome-based (TWA) build.
android {
    namespace 'cz.waltersystem.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cz.waltersystem.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '2.1.0'
        buildConfigField 'String', 'START_URL', '"https://app.waltersystem.cz/"'
        buildConfigField 'String', 'APP_HOST', '"app.waltersystem.cz"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // The build is signed by build-apk.sh, outside Gradle.
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
