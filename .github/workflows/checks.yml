# Runs on every push and pull request. Needs no secrets: the server tests use
# no API key and no database, and the client is linted, type-checked and built.
# Lint runs with two style rules off (explicit `any`, Fast Refresh exports):
# the code has many of both, and a check that always fails gets ignored.
# Everything else, the React hook rules included, must pass.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Both servers parse
        run: node --check server.js && node --check server-postgres.js
      - name: Tests (Jarvis helpers, model routing, login guard, section guards)
        run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (hook rules and the rest; not `any` or Fast Refresh exports)
        run: |
          npx eslint . --rule '@typescript-eslint/no-explicit-any: off' --rule 'react-refresh/only-export-components: off'
      - name: Type check
        run: npx tsc -b
      - name: Build
        run: npx vite build
